<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İK Modülü Paneli (Demo)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .tabs { margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tabs button { background: none; border: none; font-size: 16px; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
        .tabs button.active { background: #007bff; color: white; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button.btn { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button.btn:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; }
        .status { padding: 10px; background: #e2e3e5; margin-bottom: 15px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tarım Makineleri Fabrikası İK Modülü</h1>
    <div id="statusMessage" class="status"></div>

    <div class="tabs">
        <button class="active" onclick="switchTab('employees')">Personel Yönetimi</button>
        <button onclick="window.open('http://127.0.0.1:8000/docs', '_blank')" style="background: #17a2b8; color: white;">API Belgeleri (Swagger)</button>
    </div>

    <div id="employees-tab">
        <h2>Yeni Personel Ekle</h2>
        <form id="employeeForm">
            <div class="form-group">
                <label>Ad</label>
                <input type="text" id="first_name" required>
            </div>
            <div class="form-group">
                <label>Soyad</label>
                <input type="text" id="last_name" required>
            </div>
            <div class="form-group">
                <label>E-Posta</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Görev / Rol</label>
                <input type="text" id="role_title" placeholder="Örn: Kaynak Ustası, Makine Mühendisi" required>
            </div>
            <div class="form-group">
                <label>İşe Giriş Tarihi</label>
                <input type="date" id="hire_date" required>
            </div>
            <button type="submit" class="btn">Personeli Kaydet</button>
        </form>

        <h2>Personel Listesi</h2>
        <button class="btn" onclick="fetchEmployees()" style="background: #6c757d; margin-bottom: 10px;">Listeyi Yenile</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ad Soyad</th>
                    <th>Görev</th>
                    <th>E-Posta</th>
                    <th>İşe Giriş</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <!-- Data will be populated here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'http://127.0.0.1:8000';

    function showStatus(msg, isError=false) {
        const el = document.getElementById('statusMessage');
        el.style.display = 'block';
        el.style.backgroundColor = isError ? '#f8d7da' : '#d4edda';
        el.style.color = isError ? '#721c24' : '#155724';
        el.innerText = msg;
        setTimeout(() => el.style.display = 'none', 3000);
    }

    document.getElementById('employeeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            email: document.getElementById('email').value,
            role_title: document.getElementById('role_title').value,
            hire_date: document.getElementById('hire_date').value,
            is_active: true
        };

        try {
            const res = await fetch(`${API_URL}/employees/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                showStatus("Personel başarıyla eklendi!");
                document.getElementById('employeeForm').reset();
                fetchEmployees();
            } else {
                const err = await res.json();
                showStatus("Hata: " + JSON.stringify(err), true);
            }
        } catch (error) {
            showStatus("Bağlantı hatası: Sunucu çalışıyor mu?", true);
        }
    });

    async function fetchEmployees() {
        const tbody = document.getElementById('employeeTableBody');
        tbody.innerHTML = '<tr><td colspan="5">Yükleniyor...</td></tr>';
        try {
            const res = await fetch(`${API_URL}/employees/`);
            if (res.ok) {
                const data = await res.json();
                tbody.innerHTML = '';
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">Henüz personel bulunmuyor.</td></tr>';
                }
                data.forEach(emp => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${emp.id}</td>
                            <td>${emp.first_name} ${emp.last_name}</td>
                            <td>${emp.role_title}</td>
                            <td>${emp.email}</td>
                            <td>${emp.hire_date}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5">Veri çekilemedi.</td></tr>';
            }
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="5">API Bağlantı hatası. API sunucusunun http://127.0.0.1:8000 adresinde açık olduğundan emin olun.</td></tr>';
        }
    }

    // Load initial data
    window.onload = fetchEmployees;
</script>
</body>
</html>
